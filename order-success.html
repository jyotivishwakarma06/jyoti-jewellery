<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Order Successful | Jyoti Jewellery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#f8f9fa;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:Arial, sans-serif;
}

.success-box{

    background:#fff;
    width:700px;
    max-width:95%;
    border-radius:20px;
    padding:40px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);

}

.icon{

    font-size:90px;
    color:#28a745;

}

h1{

    margin-top:20px;
    font-weight:bold;

}

.order-id{

    font-size:20px;
    color:#666;
    margin-top:15px;

}

.delivery{

    background:#fff3cd;
    padding:15px;
    border-radius:10px;
    margin:25px 0;

}

.btn{

    margin:8px;

}

</style>

</head>

<body>

<div class="success-box">

<i class="fa-solid fa-circle-check icon"></i>

<h1>

Order Placed Successfully 🎉

</h1>

<p class="lead">

Thank you for shopping with <b>Jyoti Jewellery</b>.

</p>

<p class="order-id">

Order ID :
<b id="orderNumber"></b>

</p>

<div class="delivery">

<h5>

📦 Estimated Delivery

</h5>

<p id="deliveryDate"></p>

</div>

<a href="index.html"
class="btn btn-warning"
onclick="clearOrder()">

Continue Shopping

</a>

<a href="bridal.html"
class="btn btn-dark">

View Collections

</a>
</div>

<script>

// Random Order ID

// Order ID

let order = localStorage.getItem("orderNumber");

if(!order){

    order = "JJ-" + Math.floor(Math.random()*900000+100000);

    localStorage.setItem("orderNumber", order);

}

document.getElementById("orderNumber").innerHTML = order;

// Delivery Date

let today = new Date();

today.setDate(today.getDate() + 5);

// Clear Cart & Checkout

localStorage.removeItem("cart");
localStorage.removeItem("checkoutItems");

function clearOrder(){

localStorage.removeItem("orderNumber");

localStorage.removeItem("checkoutItems");

localStorage.removeItem("cart");

}
</script>

</body>

</html>
