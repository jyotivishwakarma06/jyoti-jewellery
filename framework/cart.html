<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Shopping Cart | Jyoti Jewellery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{

background:#f8f9fa;

font-family:Arial,sans-serif;

}

.navbar{

background:#111;

}

.navbar-brand{

font-size:28px;

font-weight:bold;

color:#d4af37 !important;

}

.nav-link{

color:white !important;

}

.page-title{

padding:40px 0;

text-align:center;

}

.page-title h2{

font-weight:bold;

}

.cart-card{

border:none;

border-radius:15px;

overflow:hidden;

transition:.3s;

}

.cart-card:hover{

transform:translateY(-5px);

box-shadow:0 10px 20px rgba(0,0,0,.15);

}

.cart-card img{

height:220px;

object-fit:cover;

}

.price{

font-size:22px;

font-weight:bold;

color:#d4af37;

}

.qty-btn{

width:35px;

height:35px;

padding:0;

}

.summary{

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 10px 20px rgba(0,0,0,.1);

position:sticky;

top:20px;

}

footer{

background:#111;

color:white;

padding:20px;

margin-top:50px;

text-align:center;

}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a class="navbar-brand" href="index.html">

💍 Jyoti Jewellery

</a>

<button class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse"
id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">

<a class="nav-link"
href="index.html">

Home

</a>

</li>

<li class="nav-item">

<a class="nav-link"
href="wishlist.html">

❤️ Wishlist

<span class="badge bg-danger"
id="wishlistCount">

0

</span>

</a>

</li>

<li class="nav-item">

<a class="nav-link active"
href="cart.html">

🛒 Cart

<span class="badge bg-warning text-dark"
id="cartCount">

0

</span>

</a>

</li>

</ul>

</div>

</div>

</nav>

<!-- Heading -->

<div class="container">

<div class="page-title">

<h2>

🛒 Shopping Cart

</h2>

<p>

Review your selected jewellery before checkout.

</p>

</div>

<div class="row">

<!-- Cart Products -->

<div class="col-lg-8">

<div class="row"

id="cartItems">

<!-- Products will come here -->

</div>

</div>

<!-- Order Summary -->

<div class="col-lg-4">

<div class="summary">

<h4>

Order Summary

</h4>

<hr>

<p>

Subtotal

<span class="float-end"

id="subtotal">

₹0

</span>

</p>

<p>

GST (18%)

<span class="float-end"

id="gst">

₹0

</span>

</p>

<hr>

<h5>

Total

<span class="float-end"

id="grandTotal">

₹0

</span>

</h5>

<hr>
<button
class="btn btn-warning w-100 mb-2"
onclick="checkoutSelected()">

Proceed To Checkout

</button>

<a href="index.html"

class="btn btn-dark w-100">

Continue Shopping

</a>

</div>

</div>

</div>

</div>

<footer>

© 2026 Jyoti Jewellery | Designed By Jyoti Vishwakarma

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Part-2 JavaScript here -->

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

displayCart();
updateNavbarCount();

// ============================
// Display Cart
// ============================

function displayCart(){

    let output = "";
    let subtotal = 0;

    if(cart.length === 0){

        output = `
        <div class="col-12 text-center py-5">
            <h2>🛒 Your Cart is Empty</h2>
            <p>Add your favourite jewellery.</p>
            <a href="index.html" class="btn btn-warning">
                Continue Shopping
            </a>
        </div>
        `;

        document.getElementById("cartItems").innerHTML = output;
        document.getElementById("subtotal").innerHTML = "₹0";
        document.getElementById("gst").innerHTML = "₹0";
        document.getElementById("grandTotal").innerHTML = "₹0";

        return;
    }

    cart.forEach((item,index)=>{

        subtotal += Number(item.price) * item.qty;

        output += `
        <div class="col-md-6 mb-4">

            <div class="card cart-card shadow">

                <img src="${item.image}" class="card-img-top">

                <div class="card-body text-center">

                    <div class="form-check text-start mb-2">

                        <input
                        class="form-check-input"
                        type="checkbox"
                        id="check${index}"
                        checked
                        onchange="calculateTotal()">

                        <label class="form-check-label">
                            Buy this Product
                        </label>

                    </div>

                    <h5>${item.name}</h5>

                    <p class="price">
                        ₹${Number(item.price).toLocaleString()}
                    </p>

                    <div class="d-flex justify-content-center align-items-center mb-3">

                        <button
                        class="btn btn-outline-dark qty-btn"
                        onclick="decreaseQty(${index})">
                        -
                        </button>

                        <span class="mx-3 fw-bold">
                            ${item.qty}
                        </span>

                        <button
                        class="btn btn-outline-dark qty-btn"
                        onclick="increaseQty(${index})">
                        +
                        </button>

                    </div>

                    <button
                    class="btn btn-danger"
                    onclick="removeCart(${index})">
                    Remove
                    </button>

                </div>

            </div>

        </div>
        `;

    });

    document.getElementById("cartItems").innerHTML = output;

    let gst = subtotal * 0.18;
    let total = subtotal + gst;

    document.getElementById("subtotal").innerHTML =
    "₹" + subtotal.toLocaleString();

    document.getElementById("gst").innerHTML =
    "₹" + gst.toLocaleString();

    document.getElementById("grandTotal").innerHTML =
    "₹" + total.toLocaleString();

    setTimeout(calculateTotal,100);

}

// ============================
// Increase Qty
// ============================

function increaseQty(index){

    cart[index].qty++;

    localStorage.setItem("cart",JSON.stringify(cart));

    displayCart();

    updateNavbarCount();

}

// ============================
// Decrease Qty
// ============================

function decreaseQty(index){

    if(cart[index].qty>1){

        cart[index].qty--;

    }else{

        cart.splice(index,1);

    }

    localStorage.setItem("cart",JSON.stringify(cart));

    displayCart();

    updateNavbarCount();

}

// ============================
// Remove Product
// ============================

function removeCart(index){

    cart.splice(index,1);

    localStorage.setItem("cart",JSON.stringify(cart));

    displayCart();

    updateNavbarCount();

}

// ============================
// Calculate Selected Total
// ============================

function calculateTotal(){

    let subtotal = 0;

    cart.forEach((item,index)=>{

        let checkbox = document.getElementById("check"+index);

        if(checkbox && checkbox.checked){

            subtotal += Number(item.price) * item.qty;

        }

    });

    let gst = subtotal * 0.18;
    let total = subtotal + gst;

    document.getElementById("subtotal").innerHTML =
    "₹" + subtotal.toLocaleString();

    document.getElementById("gst").innerHTML =
    "₹" + gst.toLocaleString();

    document.getElementById("grandTotal").innerHTML =
    "₹" + total.toLocaleString();

}

// ============================
// Navbar Counter
// ============================

function updateNavbarCount(){

    document.getElementById("wishlistCount").innerHTML =
    wishlist.length;

    let totalQty = 0;

    cart.forEach(item=>{

        totalQty += item.qty;

    });

    document.getElementById("cartCount").innerHTML =
    totalQty;

}

// ============================
// Checkout Selected
// ============================

function checkoutSelected(){

    let selected=[];

    cart.forEach((item,index)=>{

        let checkbox=document.getElementById("check"+index);

        if(checkbox && checkbox.checked){

            selected.push(item);

        }

    });

    if(selected.length===0){

        alert("Please select at least one product.");

        return;

    }

    localStorage.setItem("checkoutItems",JSON.stringify(selected));

    window.location.href="checkout.html";

}

</script>
</body>

</html>
