<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Checkout | Jyoti Jewellery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f8f9fa;
}

.navbar-brand{
    color:#ffc107 !important;
    font-weight:bold;
}

.checkout-box{

    background:#fff;

    border-radius:15px;

    padding:25px;

    box-shadow:0 10px 25px rgba(0,0,0,.1);

}

.summary{

    background:#fff;

    border-radius:15px;

    padding:25px;

    box-shadow:0 10px 25px rgba(0,0,0,.1);

}

.product-img{

    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:10px;

}

footer{

    background:#111;
    color:white;
    margin-top:60px;
    padding:20px;

}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="index.html">

Jyoti Jewellery

</a>

</div>

</nav>


<div class="container py-5">

<div class="row">

<div class="col-lg-7">

<div class="checkout-box">

<h3 class="mb-4">

Billing Details

</h3>

<input
type="text"
id="name"
class="form-control mb-3"
placeholder="Full Name">

<input
type="email"
id="email"
class="form-control mb-3"
placeholder="Email">

<input
type="text"
id="phone"
class="form-control mb-3"
placeholder="Phone Number">

<textarea
id="address"
class="form-control mb-3"
rows="4"
placeholder="Full Address"></textarea>

<input
type="text"
id="city"
class="form-control mb-3"
placeholder="City">

<input
type="text"
id="pincode"
class="form-control mb-3"
placeholder="Pincode">

<h5 class="mt-4">

Payment Method

</h5>

<div class="form-check">

<input class="form-check-input"
type="radio"
checked>

<label class="form-check-label">

Cash On Delivery

</label>

</div>

<div class="form-check">

<input class="form-check-input"
type="radio">

<label class="form-check-label">

UPI

</label>

</div>

<div class="form-check">

<input class="form-check-input"
type="radio">

<label class="form-check-label">

Debit / Credit Card

</label>

</div>

<button
class="btn btn-warning w-100 mt-4"
onclick="placeOrder()">

Place Order

</button>

</div>

</div>

<div class="col-lg-5">

<div class="summary">

<h3>

Order Summary

</h3>

<hr>

<div id="orderItems"></div>

<hr>

<h4>

Grand Total :

₹ <span id="total">

0

</span>

</h4>

</div>

</div>

</div>

</div>

<footer class="text-center">

© 2026 Jyoti Jewellery | Designed By Jyoti Vishwakarma

</footer>


<script>

let checkout = JSON.parse(localStorage.getItem("checkoutItems")) || [];
if (checkout.length === 0) {

    document.getElementById("orderItems").innerHTML =
    "<h5 class='text-danger'>No Product Selected</h5>";

    document.getElementById("total").innerHTML = "0";
}


let html = "";
let total = 0;

if (checkout.length > 0) {

    checkout.forEach(item => {

        total += item.price * item.qty;

        html += `

<div class="d-flex mb-3">

<img src="${item.image}" class="product-img me-3">

<div>

<h6>${item.name}</h6>

<p>₹${item.price.toLocaleString()} × ${item.qty}</p>

</div>

</div>

`;

    });

}

document.getElementById("orderItems").innerHTML = html;
document.getElementById("total").innerHTML = total.toLocaleString();

function placeOrder(){

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let phone=document.getElementById("phone").value.trim();
let address=document.getElementById("address").value.trim();
let city=document.getElementById("city").value.trim();
let pincode=document.getElementById("pincode").value.trim();

if(name=="" || email=="" || phone=="" ||
address=="" || city=="" || pincode==""){

alert("⚠ Please Fill All Details");

return;

}

alert("🎉 Order Placed Successfully!");

localStorage.removeItem("checkoutItems");
localStorage.removeItem("cart");

window.location.href="order-success.html";

}
</script>

</body>
</html>
