<!-- Heading -->

<div class="container">

<div class="page-title">

<h2>

❤️ My Wishlist

</h2>

<p>

Save your favourite jewellery for later.

</p>

</div>

<div class="row"
id="wishlistItems">

<!-- Products will come here -->

</div>

</div>
<div class="text-center mb-4">

<a href="index.html"

class="btn btn-dark">

← Continue Shopping

</a>

</div>
<!---Footer---->
<footer>

© 2026 Jyoti Jewellery | Designed By Jyoti Vishwakarma

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript will come in Part-2 -->

<script>

// =============================
// Load Wishlist
// =============================

let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
let cart = JSON.parse(localStorage.getItem("cart")) || [];

displayWishlist();
updateNavbarCount();


// =============================
// Display Wishlist
// =============================

function displayWishlist(){

let output="";

if(wishlist.length==0){

output=`

<div class="empty">

<i class="fa-solid fa-heart-crack"></i>

<h3>Your Wishlist is Empty</h3>

<p>Add your favourite jewellery to wishlist.</p>

<a href="index.html" class="btn btn-warning">

Continue Shopping

</a>

</div>

`;

document.getElementById("wishlistItems").innerHTML=output;

return;

}

wishlist.forEach((item,index)=>{

output+=`

<div class="col-lg-4 col-md-6 mb-4">

<div class="card wishlist-card shadow">

<img src="${item.image}" class="card-img-top">

<div class="card-body text-center">

<h5>${item.name}</h5>

<div class="rating">

⭐⭐⭐⭐⭐

</div>

<p>

<span class="price">

₹${Number(item.price).toLocaleString()}

</span>

</p>

<div class="discount">

20% OFF

</div>

<div class="d-grid gap-2">

<button
class="btn btn-cart"
onclick="moveToCart(${index})">

🛒 Add To Cart

</button>

<button
class="btn btn-remove"
onclick="removeWishlist(${index})">

Remove

</button>

</div>

</div>

</div>

</div>

`;

});

document.getElementById("wishlistItems").innerHTML=output;

}



// =============================
// Remove Wishlist
// =============================

function removeWishlist(index){

wishlist.splice(index,1);

localStorage.setItem("wishlist",JSON.stringify(wishlist));

displayWishlist();

updateNavbarCount();

}



// =============================
// Move To Cart
// =============================

function moveToCart(index){

let item=wishlist[index];

let exist=cart.find(product=>product.name===item.name);

if(exist){

exist.qty++;

}else{

item.qty=1;

cart.push(item);

}

localStorage.setItem("cart",JSON.stringify(cart));

wishlist.splice(index,1);

localStorage.setItem("wishlist",JSON.stringify(wishlist));

displayWishlist();

updateNavbarCount();

showToast("🛒 Product Added To Cart");

}



// =============================
// Navbar Counter
// =============================

function updateNavbarCount(){

document.getElementById("wishlistCount").innerHTML=wishlist.length;

let total=0;

cart.forEach(item=>{

total+=item.qty;

});

document.getElementById("cartCount").innerHTML=total;

}


function showToast(message){

let toast=document.createElement("div");

toast.innerHTML=message;

toast.style.position="fixed";

toast.style.top="20px";

toast.style.right="20px";

toast.style.background="#198754";

toast.style.color="white";

toast.style.padding="15px 25px";

toast.style.borderRadius="8px";

toast.style.boxShadow="0 5px 15px rgba(0,0,0,.2)";

toast.style.zIndex="9999";

document.body.appendChild(toast);

setTimeout(()=>{

toast.remove();

},2000);

}

</script>
</body>
